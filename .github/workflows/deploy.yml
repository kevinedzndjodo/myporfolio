name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://myporfolio-api.onrender.com/api' }}

      - name: Smoke test the built bundle
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');const m=html.match(/src=\"(\/myporfolio\/assets\/[^\"]+\.js)\"/);if(!m)throw new Error('No JS bundle found in dist/index.html');const js=fs.readFileSync('.'+m[1],'utf8');if(!js.includes('data/content'))console.log('WARN: fallback content may be missing');console.log('Bundle found:',m[1],'('+(js.length/1024).toFixed(1)+' KiB)');"

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
